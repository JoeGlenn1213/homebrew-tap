name: Update formulae

# Keeps Formula/lgh.rb and Formula/actiond.rb in sync with the latest
# published releases. Checks every 6 hours (offset from the top of the hour
# to dodge schedule-load spikes) and on demand.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update formulae from latest releases
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_formulae.py

      - name: Syntax-check formulae
        run: |
          ruby -c Formula/lgh.rb
          ruby -c Formula/actiond.rb

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "brew: bump formulae to latest releases ($(date -u +%Y-%m-%d))"
          git push
