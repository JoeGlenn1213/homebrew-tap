name: Formula CI

# Syntax, style, and audit for every formula. Runs on pull requests and on
# pushes to main. Does not install the formulae or start brew services.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_ANALYTICS: "1"

    steps:
      - name: Install Ruby for syntax checks
        run: sudo apt-get update && sudo apt-get install -y ruby

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          # Third-party taps are audited by the Homebrew users actually run.
          stable: true

      - name: Syntax-check formulae
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(Formula/*.rb)
          if ((${#files[@]} == 0)); then
            echo "no formulae found" >&2
            exit 1
          fi
          for formula in "${files[@]}"; do
            ruby -c "$formula"
          done

      - name: Test formula update script
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Install Homebrew developer gems
        run: brew install-bundler-gems

      - name: brew style
        run: brew style Formula

      - name: brew audit
        run: brew audit --strict --tap="${{ steps.set-up-homebrew.outputs.tap-name }}"
